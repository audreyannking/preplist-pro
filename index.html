<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PrepList Pro</title>
<meta name="description" content="Notes, videos and past papers, organized by subject and exam type." />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css" />
<style>
  html, body { margin: 0; background: #FFFFFF; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>

<!-- Firebase (compat SDK — plain globals, no bundler needed). Auth is used only
     for a silent, invisible "anonymous" session — no accounts, no fields,
     nothing the visitor ever sees — just so the database rules have
     something real to check instead of being wide open. -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

<!-- React, via CDN. The app itself (app.js) is precompiled ahead of time from
     app.jsx — faster to load than transpiling JSX in the browser on every visit. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<!-- KaTeX — renders math typed as $...$ (fractions, integrals, square roots, etc.) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>

<!-- Loads the newest app.js every visit (the tiny version.txt is always fetched
     fresh), so a browser can never get stuck showing an old copy of the site. -->
<script>
  (function () {
    function load(v) {
      var s = document.createElement("script");
      window.__ppVersion = v || "";
      s.src = "app.js" + (v ? "?v=" + encodeURIComponent(v) : "");
      document.body.appendChild(s);
    }
    fetch("version.txt", { cache: "no-store" })
      .then(function (r) { return r.ok ? r.text() : ""; })
      .then(function (t) { load((t || "").trim()); })
      .catch(function () { load(""); });
  })();
</script>
</body>
</html>
